name: Sync Contents (Media → R2, MD → Neon DB)

on:
  push:
    branches:
      - main
    paths:
      - "contents/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1 diff를 위해 필수

      # 2. Node.js 환경 구성
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          npm install gray-matter pg mime-types @aws-sdk/client-s3

      # ------------------------------------
      # 4️⃣ 이미지 변경 여부 감지
      # ------------------------------------
      - name: Detect media changes
        id: media_check
        run: |
          echo "changed=false" >> $GITHUB_OUTPUT

          git diff --name-only HEAD~1 HEAD \
            | grep "^contents/.*/assets/" \
            && echo "changed=true" >> $GITHUB_OUTPUT \
            || true

      # ------------------------------------
      # 5️⃣ Media → R2 (조건부 실행)
      # ------------------------------------
      - name: Sync media to R2
        if: steps.media_check.outputs.changed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          GIT_DIFF_RANGE: HEAD~1 HEAD
        run: |
          node scripts/sync_media_to_r2.js

      # ------------------------------------
      # 6️⃣ Markdown → Neon DB (항상 실행)
      # ------------------------------------
      - name: Sync markdown to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/sync_to_db.js
