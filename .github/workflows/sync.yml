name: Sync Contents to Neon DB

on:
  push:
    paths:
      - "contents/**/*.md"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 환경 구성
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 의존성 설치 (package.json 없어도 됨)
      - name: Install dependencies
        run: npm install gray-matter pg

      # 4. DB 동기화 실행
      - name: Sync markdown to database
        run: node scripts/sync_to_db.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
