<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">write() 시스템 콜의 처리 흐름</text>

  <rect x="40" y="70" width="1120" height="200" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="64" y="102" font-size="19" font-weight="bold" fill="#075985">사용자 공간</text>
  <rect x="40" y="320" width="1120" height="250" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="64" y="352" font-size="19" font-weight="bold" fill="#5b21b6">커널 공간</text>

  <line x1="40" y1="295" x2="1160" y2="295" stroke="#b45309" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="440" y="281" width="320" height="28" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="600" y="301" text-anchor="middle" font-size="16" fill="#78350f">권한 경계 (사용자 모드 / 커널 모드)</text>

  <g font-size="18" text-anchor="middle" fill="#0f172a">
    <rect x="90" y="130" width="250" height="100" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
    <text x="215" y="170" font-weight="bold">① 프로그램</text>
    <text x="215" y="200" fill="#334155" font-size="16">write(1, msg, len) 호출</text>

    <rect x="475" y="130" width="250" height="100" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
    <text x="600" y="170" font-weight="bold">② glibc 래퍼 함수</text>
    <text x="600" y="200" fill="#334155" font-size="16">시스템 콜 번호·인자 준비</text>

    <rect x="860" y="130" width="250" height="100" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
    <text x="985" y="170" font-weight="bold">③ syscall 명령</text>
    <text x="985" y="200" fill="#334155" font-size="16">CPU가 커널 모드로 전환</text>

    <rect x="860" y="390" width="250" height="100" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="985" y="430" font-weight="bold">④ 시스템 콜 핸들러</text>
    <text x="985" y="460" fill="#334155" font-size="16">번호로 sys_write 찾기</text>

    <rect x="475" y="390" width="250" height="100" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="600" y="430" font-weight="bold">⑤ VFS</text>
    <text x="600" y="460" fill="#334155" font-size="16">fd 1이 가리키는 파일 확인</text>

    <rect x="90" y="390" width="250" height="100" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="215" y="430" font-weight="bold">⑥ 터미널(TTY) 드라이버</text>
    <text x="215" y="460" fill="#334155" font-size="16">화면에 문자열 출력</text>
  </g>

  <g stroke="#1e293b" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="340" y1="180" x2="470" y2="180"/>
    <line x1="725" y1="180" x2="855" y2="180"/>
    <line x1="985" y1="230" x2="985" y2="385"/>
    <line x1="860" y1="440" x2="730" y2="440"/>
    <line x1="475" y1="440" x2="345" y2="440"/>
  </g>
  <path d="M150,390 L150,240" stroke="#15803d" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="165" y="258" font-size="16" fill="#166534">반환값(쓴 바이트 수)</text>
  <text x="600" y="545" text-anchor="middle" font-size="16" fill="#334155">strace로 프로그램을 실행하면 ③~④ 지점에서 일어나는 시스템 콜을 추적할 수 있다</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
