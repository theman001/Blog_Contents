<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">리눅스 서버 보안의 계층</text>

  <!-- incoming -->
  <text x="600" y="100" text-anchor="middle" font-size="22" fill="#b91c1c" font-weight="bold">외부 요청</text>
  <line x1="600" y1="110" x2="600" y2="140" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/>

  <!-- side bars -->
  <rect x="60" y="150" width="170" height="470" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="145" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#5b21b6">패치 관리</text>
  <text x="145" y="395" text-anchor="middle" font-size="18" fill="#0f172a">모든 계층에</text>
  <text x="145" y="420" text-anchor="middle" font-size="18" fill="#0f172a">보안 업데이트</text>

  <rect x="970" y="150" width="170" height="470" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="1055" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#5b21b6">감사·로그</text>
  <text x="1055" y="395" text-anchor="middle" font-size="18" fill="#0f172a">모든 계층의</text>
  <text x="1055" y="420" text-anchor="middle" font-size="18" fill="#0f172a">기록과 점검</text>

  <!-- layers -->
  <rect x="260" y="150" width="680" height="100" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="600" y="192" text-anchor="middle" font-size="24" font-weight="bold" fill="#991b1b">방화벽</text>
  <text x="600" y="226" text-anchor="middle" font-size="18" fill="#0f172a">기본 차단, 필요한 포트만 허용 (ufw, firewalld)</text>

  <rect x="260" y="270" width="680" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="600" y="312" text-anchor="middle" font-size="24" font-weight="bold" fill="#9a3412">SSH 인증</text>
  <text x="600" y="346" text-anchor="middle" font-size="18" fill="#0f172a">공개키 인증만 허용, root 로그인 차단</text>

  <rect x="260" y="390" width="680" height="100" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="3"/>
  <text x="600" y="432" text-anchor="middle" font-size="24" font-weight="bold" fill="#854d0e">계정·권한</text>
  <text x="600" y="466" text-anchor="middle" font-size="18" fill="#0f172a">개인 계정, sudo, 파일 권한, 최소 권한</text>

  <rect x="260" y="520" width="680" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="600" y="562" text-anchor="middle" font-size="24" font-weight="bold" fill="#166534">서비스와 데이터</text>
  <text x="600" y="596" text-anchor="middle" font-size="18" fill="#0f172a">전용 계정과 systemd 격리 옵션으로 실행</text>

  <text x="600" y="655" text-anchor="middle" font-size="20" fill="#334155">한 계층이 뚫려도 다음 계층이 막는다 (심층 방어)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
