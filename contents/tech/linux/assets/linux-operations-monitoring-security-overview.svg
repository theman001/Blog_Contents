<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">리눅스 운영의 세 영역</text>

  <!-- 관찰 -->
  <rect x="60" y="110" width="320" height="430" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="220" y="160" text-anchor="middle" font-size="28" font-weight="bold" fill="#075985">관찰</text>
  <text x="220" y="194" text-anchor="middle" font-size="20" fill="#0f172a">리소스 모니터링</text>
  <g font-size="20" fill="#0f172a">
    <text x="90" y="250">부하: uptime</text>
    <text x="90" y="295">CPU: top, htop</text>
    <text x="90" y="340">메모리: free, vmstat</text>
    <text x="90" y="385">디스크 I/O: iostat</text>
    <text x="90" y="430">용량: df, du</text>
    <text x="90" y="475">네트워크: ss, ip</text>
  </g>

  <!-- 대응 -->
  <rect x="440" y="110" width="320" height="430" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="600" y="160" text-anchor="middle" font-size="28" font-weight="bold" fill="#92400e">대응</text>
  <text x="600" y="194" text-anchor="middle" font-size="20" fill="#0f172a">프로세스·서비스·로그</text>
  <g font-size="20" fill="#0f172a">
    <text x="470" y="250">프로세스: ps, kill</text>
    <text x="470" y="295">우선순위: nice, ionice</text>
    <text x="470" y="340">서비스: systemctl</text>
    <text x="470" y="385">유닛 파일 작성</text>
    <text x="470" y="430">로그: journalctl</text>
    <text x="470" y="475">파일 로그: /var/log</text>
  </g>

  <!-- 보호 -->
  <rect x="820" y="110" width="320" height="430" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="980" y="160" text-anchor="middle" font-size="28" font-weight="bold" fill="#166534">보호</text>
  <text x="980" y="194" text-anchor="middle" font-size="20" fill="#0f172a">보안</text>
  <g font-size="20" fill="#0f172a">
    <text x="850" y="250">계정·권한: sudo, chmod</text>
    <text x="850" y="295">SSH: 공개키 인증</text>
    <text x="850" y="340">방화벽: ufw, firewalld</text>
    <text x="850" y="385">패치: 자동 업데이트</text>
    <text x="850" y="430">감사: auditd, last</text>
    <text x="850" y="475">차단: fail2ban</text>
  </g>

  <line x1="384" y1="325" x2="434" y2="325" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="764" y1="325" x2="814" y2="325" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/>

  <!-- feedback -->
  <path d="M980,544 L980,600 L220,600 L220,550" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arr)"/>
  <text x="600" y="635" text-anchor="middle" font-size="20" fill="#334155">감사 로그와 보안 기록은 다시 관찰의 재료가 된다</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
