<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">리눅스 시스템의 계층 구조</text>

  <!-- user space band -->
  <rect x="40" y="70" width="1120" height="250" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="64" y="104" font-size="20" font-weight="bold" fill="#075985">사용자 공간 (User Space)</text>

  <rect x="190" y="122" width="400" height="80" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="390" y="155" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">사용자 애플리케이션</text>
  <text x="390" y="184" text-anchor="middle" font-size="16" fill="#334155">웹 브라우저, 웹 서버, 데이터베이스</text>

  <rect x="610" y="122" width="400" height="80" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="810" y="155" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">셸 · 유틸리티</text>
  <text x="810" y="184" text-anchor="middle" font-size="16" fill="#334155">bash, zsh, coreutils (ls, cp, grep)</text>

  <rect x="190" y="220" width="820" height="80" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="600" y="253" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">시스템 라이브러리</text>
  <text x="600" y="282" text-anchor="middle" font-size="16" fill="#334155">glibc, musl: 시스템 콜을 감싼 표준 C 함수</text>

  <!-- syscall boundary -->
  <line x1="40" y1="345" x2="1160" y2="345" stroke="#b45309" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="380" y="327" width="440" height="36" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="600" y="352" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">시스템 콜 인터페이스 (read, write, fork ...)</text>

  <!-- kernel band -->
  <rect x="40" y="370" width="1120" height="180" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="64" y="404" font-size="20" font-weight="bold" fill="#5b21b6">커널 공간 (Kernel Space)</text>

  <g font-size="17" text-anchor="middle" fill="#0f172a">
    <rect x="64" y="422" width="200" height="104" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="164" y="466" font-weight="bold">프로세스 관리</text>
    <text x="164" y="492" fill="#334155">스케줄러</text>
    <rect x="282" y="422" width="200" height="104" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="382" y="466" font-weight="bold">메모리 관리</text>
    <text x="382" y="492" fill="#334155">가상 메모리, 페이징</text>
    <rect x="500" y="422" width="200" height="104" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="600" y="466" font-weight="bold">VFS</text>
    <text x="600" y="492" fill="#334155">ext4, XFS, Btrfs</text>
    <rect x="718" y="422" width="200" height="104" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="818" y="466" font-weight="bold">네트워크 스택</text>
    <text x="818" y="492" fill="#334155">TCP/IP, 소켓</text>
    <rect x="936" y="422" width="200" height="104" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="1036" y="466" font-weight="bold">디바이스 드라이버</text>
    <text x="1036" y="492" fill="#334155">커널 모듈로 적재</text>
  </g>

  <!-- hardware -->
  <rect x="40" y="570" width="1120" height="80" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="64" y="618" font-size="20" font-weight="bold" fill="#1e293b">하드웨어</text>
  <text x="680" y="618" text-anchor="middle" font-size="19" fill="#1e293b">CPU · 메모리 · 디스크 · 네트워크 카드</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
