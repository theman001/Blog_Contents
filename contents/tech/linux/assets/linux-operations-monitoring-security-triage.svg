<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">서버가 느릴 때의 점검 순서</text>

  <g stroke-width="3">
    <rect x="60"  y="120" width="320" height="170" rx="14" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="440" y="120" width="320" height="170" rx="14" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="820" y="120" width="320" height="170" rx="14" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="820" y="400" width="320" height="170" rx="14" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="440" y="400" width="320" height="170" rx="14" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="60"  y="400" width="320" height="170" rx="14" fill="#fef3c7" stroke="#b45309"/>
  </g>

  <g fill="#0f172a">
    <text x="220" y="170" text-anchor="middle" font-size="22" fill="#075985" font-weight="bold">1. 전체 부하</text>
    <text x="220" y="215" text-anchor="middle" font-size="24" font-family="monospace">uptime</text>
    <text x="220" y="255" text-anchor="middle" font-size="18">load average와 코어 수 비교</text>

    <text x="600" y="170" text-anchor="middle" font-size="22" fill="#075985" font-weight="bold">2. CPU·프로세스</text>
    <text x="600" y="215" text-anchor="middle" font-size="24" font-family="monospace">top</text>
    <text x="600" y="255" text-anchor="middle" font-size="18">상위 프로세스, wa, st</text>

    <text x="980" y="170" text-anchor="middle" font-size="22" fill="#075985" font-weight="bold">3. 메모리·스왑</text>
    <text x="980" y="215" text-anchor="middle" font-size="24" font-family="monospace">free -h, vmstat 1</text>
    <text x="980" y="255" text-anchor="middle" font-size="18">available, si/so</text>

    <text x="980" y="450" text-anchor="middle" font-size="22" fill="#075985" font-weight="bold">4. 디스크</text>
    <text x="980" y="495" text-anchor="middle" font-size="24" font-family="monospace">iostat -xz 1, df -h</text>
    <text x="980" y="535" text-anchor="middle" font-size="18">await, 큐 길이, 용량</text>

    <text x="600" y="450" text-anchor="middle" font-size="22" fill="#075985" font-weight="bold">5. 네트워크</text>
    <text x="600" y="495" text-anchor="middle" font-size="24" font-family="monospace">ss -s, ss -tulpn</text>
    <text x="600" y="535" text-anchor="middle" font-size="18">연결 수, 열린 포트</text>

    <text x="220" y="450" text-anchor="middle" font-size="22" fill="#92400e" font-weight="bold">6. 원인 확인</text>
    <text x="220" y="495" text-anchor="middle" font-size="24" font-family="monospace">journalctl</text>
    <text x="220" y="535" text-anchor="middle" font-size="18">해당 시간대 서비스·커널 로그</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none">
    <line x1="384" y1="205" x2="434" y2="205" marker-end="url(#arr)"/>
    <line x1="764" y1="205" x2="814" y2="205" marker-end="url(#arr)"/>
    <line x1="980" y1="294" x2="980" y2="394" marker-end="url(#arr)"/>
    <line x1="816" y1="485" x2="766" y2="485" marker-end="url(#arr)"/>
    <line x1="436" y1="485" x2="386" y2="485" marker-end="url(#arr)"/>
  </g>
  <text x="600" y="630" text-anchor="middle" font-size="20" fill="#334155">넓은 범위에서 시작해 원인 자원으로 좁혀간다</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
