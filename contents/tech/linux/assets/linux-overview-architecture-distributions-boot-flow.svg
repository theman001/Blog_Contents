<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="420" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">리눅스 부팅 순서</text>

  <g font-size="18" text-anchor="middle" fill="#0f172a">
    <rect x="30" y="110" width="160" height="150" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="110" y="160" font-weight="bold">① 펌웨어</text>
    <text x="110" y="192" font-size="16" fill="#334155">BIOS / UEFI</text>
    <text x="110" y="218" font-size="15" fill="#334155">하드웨어 점검</text>

    <rect x="226" y="110" width="160" height="150" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="306" y="160" font-weight="bold">② 부트로더</text>
    <text x="306" y="192" font-size="16" fill="#334155">GRUB 등</text>
    <text x="306" y="218" font-size="15" fill="#334155">커널 이미지 적재</text>

    <rect x="422" y="110" width="160" height="150" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="502" y="160" font-weight="bold">③ 커널</text>
    <text x="502" y="192" font-size="16" fill="#334155">vmlinuz</text>
    <text x="502" y="218" font-size="15" fill="#334155">하드웨어 초기화</text>

    <rect x="618" y="110" width="160" height="150" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="698" y="160" font-weight="bold">④ initramfs</text>
    <text x="698" y="192" font-size="16" fill="#334155">임시 루트</text>
    <text x="698" y="218" font-size="15" fill="#334155">실제 루트 마운트</text>

    <rect x="814" y="110" width="160" height="150" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="894" y="160" font-weight="bold">⑤ init</text>
    <text x="894" y="192" font-size="16" fill="#334155">systemd (PID 1)</text>
    <text x="894" y="218" font-size="15" fill="#334155">서비스 기동</text>

    <rect x="1010" y="110" width="160" height="150" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="1090" y="160" font-weight="bold">⑥ 로그인</text>
    <text x="1090" y="192" font-size="16" fill="#334155">getty, 디스플레이</text>
    <text x="1090" y="218" font-size="15" fill="#334155">매니저 → 셸</text>
  </g>

  <g stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="192" y1="185" x2="222" y2="185"/>
    <line x1="388" y1="185" x2="418" y2="185"/>
    <line x1="584" y1="185" x2="614" y2="185"/>
    <line x1="780" y1="185" x2="810" y2="185"/>
    <line x1="976" y1="185" x2="1006" y2="185"/>
  </g>

  <line x1="30" y1="300" x2="582" y2="300" stroke="#6d28d9" stroke-width="3"/>
  <text x="306" y="330" text-anchor="middle" font-size="17" fill="#5b21b6">커널 공간이 준비되는 단계</text>
  <line x1="814" y1="300" x2="1170" y2="300" stroke="#0369a1" stroke-width="3"/>
  <text x="992" y="330" text-anchor="middle" font-size="17" fill="#075985">사용자 공간이 시작되는 단계</text>
  <text x="600" y="380" text-anchor="middle" font-size="16" fill="#334155">PID 1(init)은 이후 실행되는 모든 사용자 공간 프로세스의 조상이 된다</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
